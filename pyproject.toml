[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegramlab"
version = "0.1.0"
description = "A local-first foundation for Telegram research workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Telethon>=1.34,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
telegramlab = "telegramlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
